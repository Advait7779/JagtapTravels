services:
  crm:
    build: .
    environment:
      NODE_ENV: production
      STORAGE_MODE: postgres
      PORT: 5000
      TRUST_PROXY: 1
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/jagtap_tours_crm
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-10080}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - '127.0.0.1:5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
    command: ['sh', '-c', 'node scripts/database.js migrate && exec node index.js']
    restart: unless-stopped
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: jagtap_tours_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d jagtap_tours_crm']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  uploads_data:
